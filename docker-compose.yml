name: task-manager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - task_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-task_manager}:${POSTGRES_PASSWORD:-task_manager}@db:5432/${POSTGRES_DB:-task_manager}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-random-secret-of-at-least-32-bytes}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-different-random-secret-of-at-least-32-bytes}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-30}
    ports:
      - "5000:5000"
    volumes:
      - task_manager_uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  task_manager_postgres_data:
  task_manager_uploads_data:
